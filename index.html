<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GameTime Arcade 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b18;color:white;font-family:system-ui,Arial,sans-serif}
header{padding:18px;text-align:center;background:#10152b;border-bottom:1px solid #303d68}
h1{margin:0;color:#48f5ff;font-size:clamp(25px,5vw,42px);text-shadow:0 0 18px #00bfff}
header p{color:#b8c6e9;margin:7px 0 0}
main{max-width:1100px;margin:auto;padding:16px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.game{min-height:105px;border:1px solid #34466e;border-radius:16px;background:linear-gradient(145deg,#192447,#101326);color:white;padding:15px 8px;font-size:16px;font-weight:bold;cursor:pointer}
.game span{display:block;font-size:30px;margin-bottom:7px}
.game:active,.game:hover{border-color:#45f5ff;box-shadow:0 0 15px #00c9ff55}
#play{display:none;margin-top:18px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px}
button{background:#202d50;border:1px solid #425b8d;border-radius:10px;color:white;padding:11px 14px;font-weight:bold;cursor:pointer}
button:active{background:#087c99}
#title{color:#5cf7ff;font-size:22px;font-weight:bold}
#hud{color:#cbd8ff}
#stage{position:relative;background:#030612;border:1px solid #34466e;border-radius:16px;overflow:hidden}
#view{display:block;width:100%;height:min(58vh,520px);touch-action:manipulation}
#chess{display:none;background:#11182e;padding:10px;border-radius:12px}
#board{display:grid;grid-template-columns:repeat(8,1fr);max-width:480px;margin:auto;aspect-ratio:1}
.square{border:0;border-radius:0;padding:0;display:flex;align-items:center;justify-content:center;font-size:clamp(23px,6vw,45px);aspect-ratio:1}
.light{background:#d8e5e9;color:#111}
.dark{background:#527b94;color:#111}
.selected{outline:4px solid #ffe35a;outline-offset:-4px}
#message{text-align:center;min-height:28px;padding:8px;color:#8ffaff}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px}
.pad{font-size:24px;min-width:55px;min-height:48px;touch-action:manipulation}
#help{text-align:center;color:#aab8dc;font-size:14px;padding:6px}
footer{text-align:center;color:#8290b7;font-size:12px;padding:25px}
</style>
</head>
<body>
<header>
<h1>⚡ GameTime Arcade 3D</h1>
<p>Explore. Race. Outsmart. Become the champion.</p>
</header>
<main>
<section id="menu">
<h2>Choose your game</h2>
<div class="games">
<button class="game" onclick="startGame('maze')"><span>🟡</span>Neon Maze Chase</button>
<button class="game" onclick="startGame('race')"><span>🏎️</span>Neon Street Racer</button>
<button class="game" onclick="startGame('agent')"><span>🕵️</span>Secret Agent Ops</button>
<button class="game" onclick="startGame('chess')"><span>♟️</span>AI Chess Arena</button>
</div>
<p style="color:#aab8dc">Designed for desktop and iPad. Use the on-screen controls or your keyboard.</p>
</section>

<section id="play">
<div class="bar">
<div id="title">Game</div>
<div id="hud">Score: 0</div>
</div>
<div class="bar">
<button onclick="showMenu()">← Game menu</button>
<button onclick="resetGame()">↻ Restart</button>
<button onclick="fullScreen()">⛶ Full screen</button>
</div>
<div id="stage"><canvas id="view"></canvas></div>
<div id="chess">
<div id="board"></div>
<div id="message">Choose a piece, then choose its destination.</div>
<div style="text-align:center;margin-top:8px">
<button onclick="newChess('easy')">Easy AI</button>
<button onclick="newChess('medium')">Medium AI</button>
<button onclick="newChess('hard')">Harder AI</button>
</div>
</div>
<div class="controls" id="controls">
<button class="pad" onclick="act('left')">⬅️</button>
<button class="pad" onclick="act('up')">⬆️</button>
<button class="pad" onclick="act('down')">⬇️</button>
<button class="pad" onclick="act('right')">➡️</button>
<button class="pad" onclick="act('action')">⚡ ACTION</button>
</div>
<div id="help"></div>
</section>
</main>
<footer>GameTime Arcade · Play fair, have fun, and take breaks.</footer>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let game='',score=0,lives=3,scene,camera,renderer,player,objects=[],keys={};
let raf=0,clock,lastTime=0,playerX=0,speed=0,elapsed=0,selected=null,chess=null,aiLevel='medium';
const canvas=$('view');

function startGame(name){
 game=name;score=0;lives=3;elapsed=0;playerX=0;speed=0;
 $('menu').style.display='none';$('play').style.display='block';
 $('chess').style.display=name==='chess'?'block':'none';
 $('stage').style.display=name==='chess'?'none':'block';
 $('controls').style.display='flex';
 const names={maze:'🟡 Neon Maze Chase',race:'🏎️ Neon Street Racer',agent:'🕵️ Secret Agent: Target Ops',chess:'♟️ AI Chess Arena'};
 $('title').textContent=names[name];
 const help={
 maze:'Collect glowing orbs and avoid the red patrol bots. Use the arrows to move.',
 race:'Steer left and right to avoid traffic. Collect rings and survive as long as possible.',
 agent:'Tap the glowing training drones to score points before the timer runs out.',
 chess:'You play white. Select one of your pieces and then its destination. The computer plays black.'
 };
 $('help').textContent=help[name];
 if(name==='chess'){newChess('medium');return}
 init3D();updateHud();
}
function showMenu(){
 $('play').style.display='none';$('menu').style.display='block';
 if(raf)cancelAnimationFrame(raf);
 if(renderer){renderer.dispose();renderer=null}
}
function resetGame(){startGame(game)}
function fullScreen(){
 const el=$('play');
 if(!document.fullscreenElement){
  if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});
  else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
 }else if(document.exitFullscreen)document.exitFullscreen();
}
function updateHud(){
 $('hud').textContent=game==='agent'?'Score: '+score+' · Time: '+Math.max(0,30-Math.floor(elapsed))+'s':
 'Score: '+score+' · Lives: '+lives;
}
function mat(color,emissive=0x000000){
 return new THREE.MeshStandardMaterial({color,emissive,roughness:.55,metalness:.15});
}
function box(w,h,d,color,x,y,z,emissive=0){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color,emissive));
 m.position.set(x,y,z);scene.add(m);objects.push(m);return m;
}
function sphere(r,color,x,y,z,emissive=color){
 const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),mat(color,emissive));
 m.position.set(x,y,z);scene.add(m);objects.push(m);return m;
}
function init3D(){
 if(raf)cancelAnimationFrame(raf);
 if(renderer)renderer.dispose();
 scene=new THREE.Scene();
 scene.background=new THREE.Color(game==='maze'?0x070d25:game==='race'?0x10152d:0x08091d);
 scene.fog=new THREE.Fog(scene.background,14,45);
 camera=new THREE.PerspectiveCamera(65,1,.1,100);
 renderer=new THREE.WebGLRenderer({canvas,antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);
 scene.add(new THREE.HemisphereLight(0xa4caff,0x192038,2));
 const light=new THREE.DirectionalLight(0xffffff,2.2);light.position.set(5,12,7);scene.add(light);
 objects=[];
 if(game==='maze')buildMaze();
 if(game==='race')buildRace();
 if(game==='agent')buildAgent();
 window.addEventListener('resize',resize3D);
 lastTime=performance.now();raf=requestAnimationFrame(loop);
}
function resize3D(){
 if(!renderer||!camera)return;
 const w=canvas.clientWidth,h=canvas.clientHeight;
 renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
function buildMaze(){
 camera.position.set(0,10,9);camera.lookAt(0,0,0);
 box(14,.3,14,0x121e43,0,-.25,0);
 // Glowing maze walls
 for(let i=-6;i<=6;i+=2){
  box(.22,.65,10,0x176b9a,i,.2,0,0x004cff);
  box(10,.65,.22,0x176b9a,0,.2,i,0x004cff);
 }
 box(.3,.7,14,0x243b75,-6.8,.2,0,0x00bfff);
 box(.3,.7,14,0x243b75,6.8,.2,0,0x00bfff);
 box(14,.7,.3,0x243b75,0,.2,-6.8,0x00bfff);
 box(14,.7,.3,0x243b75,0,.2,6.8,0x00bfff);
 player=sphere(.35,0xffd82f,-5.5,.3,5.5,0xff9d00);
 // Collectible orbs
 for(let i=0;i<20;i++){
  const x=-5+(i%5)*2.5,z=-5+Math.floor(i/5)*3;
  sphere(.13,0x42f7ff,x,.15,z,0x00ddff);
 }
 for(let i=0;i<3;i++){
  const bot=sphere(.32,0xff285f,4-i*3,.35,-4+i*3,0xff0033);bot.userData.bot=true;
 }
}
function buildRace(){
 camera.position.set(0,5,9);camera.lookAt(0,0,-5);
 box(28,.2,100,0x242c40,0,-.2,-35);
 box(9,.05,100,0x383c49,0,-.08,-35);
 for(let z=5;z>-80;z-=5)box(.12,.03,2,0xffffff,0,-.02,z);
 box(.35,.5,100,0x08d9ff,-4.8,.1,-35,0x0077ff);
 box(.35,.5,100,0x08d9ff,4.8,.1,-35,0x0077ff);
 player=box(1.1,.6,1.8,0x20e8ff,0,.45,3,0x00aaff);
 box(.85,.3,.65,0x151c35,0,.85,3);
 for(let i=0;i<12;i++){
  const z=-i*7-5,x=[-2.7,0,2.7][i%3];
  const car=box(1,.7,1.7,[0xff355d,0xffb12b,0x8c61ff][i%3],x,.4,z);
  car.userData.traffic=true;
 }
 for(let i=0;i<8;i++)sphere(.2,0xffe45e,[-3,0,3][i%3],.7,-i*10-8,0xffaa00);
}
function buildAgent(){
 camera.position.set(0,3,10);camera.lookAt(0,1,0);
 box(24,.2,30,0x171d38,0,-.2,-5);
 for(let i=0;i<8;i++){
  const h=2+Math.random()*5,x=(Math.random()-.5)*18,z=-Math.random()*20;
  box(1,h,1,0x293a70,x,h/2-.1,z,0x101f55);
 }
 player=sphere(.38,0x56f8ff,0,1,0,0x00bfff);
 for(let i=0;i<7;i++){
  const target=sphere(.45,0xff3268,(Math.random()-.5)*10,1+Math.random()*3,-2-Math.random()*13,0xff003c);
  target.userData.target=true;target.userData.hit=false;
 }
}
function loop(now){
 raf=requestAnimationFrame(loop);
 if(!renderer)return;
 const dt=Math.min((now-lastTime)/1000,.05);lastTime=now;elapsed+=dt;
 if(game==='maze')updateMaze(dt);
 if(game==='race')updateRace(dt);
 if(game==='agent')updateAgent(dt);
 updateHud();renderer.render(scene,camera);
}
function updateMaze(dt){
 if(!player)return;
 // Simple open movement within the maze
 const step=3*dt;
 if(keys.left)player.position.x-=step;
 if(keys.right)player.position.x+=step;
 if(keys.up)player.position.z-=step;
 if(keys.down)player.position.z+=step;
 player.position.x=Math.max(-6,Math.min(6,player.position.x));
 player.position.z=Math.max(-6,Math.min(6,player.position.z));
 for(const o of objects){
  if(o.geometry&&o.geometry.type==='SphereGeometry'&&o!==player&&!o.userData.bot&&o.visible){
   if(o.position.distanceTo(player.position)<.55){o.visible=false;score+=10}
  }
  if(o.userData.bot){
   o.position.x=Math.sin(elapsed*1.5+o.position.z)*4;
   if(o.position.distanceTo(player.position)<.65){lives--;player.position.set(-5.5,.3,5.5);if(lives<=0){lives=3;score=Math.max(0,score-30)}}
  }
 }
 camera.position.x=player.position.x*.25;camera.position.z=player.position.z+9;camera.lookAt(player.position.x,0,player.position.z);
}
function updateRace(dt){
 if(!player)return;
 if(keys.left)player.position.x-=5*dt;
 if(keys.right)player.position.x+=5*dt;
 player.position.x=Math.max(-3.5,Math.min(3.5,player.position.x));
 score+=Math.floor(dt*2);
 for(const o of objects){
  if(o.userData.traffic||o.geometry.type==='SphereGeometry'){
   o.position.z+=speed*dt+5*dt;
   if(o.position.z>6){o.position.z=-65-Math.random()*15;o.position.x=(Math.floor(Math.random()*3)-1)*2.7;if(o.userData.traffic)score+=5}
   if(o.userData.traffic&&Math.abs(o.position.z-player.position.z)<1&&Math.abs(o.position.x-player.position.x)<1){lives--;o.position.z=-50;if(lives<=0){lives=3;score=0}}
   if(o.geometry.type==='SphereGeometry'&&Math.abs(o.position.z-player.position.z)<1&&Math.abs(o.position.x-player.position.x)<1){score+=20;o.position.z=-80}
  }
 }
 speed=Math.min(18,8+elapsed*.15);
}
function updateAgent(dt){
 for(const o of objects){
  if(o.userData.target&&!o.userData.hit){o.rotation.y+=dt*1.5;o.position.y+=Math.sin(elapsed*2+o.position.x)*dt*.25}
 }
 if(elapsed>=30){
  $('message').textContent='Mission complete! Final score: '+score+'. Restart to play again.';
  elapsed=0;score=0;
 }
}
function act(direction){
 keys[direction]=true;
 if(game==='agent'&&direction==='action'){
  const target=objects.find(o=>o.userData.target&&!o.userData.hit);
  if(target){target.userData.hit=true;target.visible=false;score+=10}
 }
 setTimeout(()=>keys[direction]=false,180);
}
document.addEventListener('keydown',e=>{
 const map={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down'};
 if(map[e.key]){keys[map[e.key]]=true;e.preventDefault()}
 if(e.key===' '&&game==='agent')act('action');
});
document.addEventListener('keyup',e=>{
 const map={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down'};
 if(map[e.key])keys[map[e.key]]=false;
});
canvas.addEventListener('pointerdown',e=>{
 if(game!=='agent'||!camera||!renderer)return;
 const rect=canvas.getBoundingClientRect();
 const mouse=new THREE.Vector2((e.clientX-rect.left)/rect.width*2-1,-((e.clientY-rect.top)/rect.height)*2+1);
 const ray=new THREE.Raycaster();ray.setFromCamera(mouse,camera);
 const targets=objects.filter(o=>o.userData.target&&!o.userData.hit&&o.visible);
 const hits=ray.intersectObjects(targets);
 if(hits.length){hits[0].object.userData.hit=true;hits[0].object.visible=false;score+=10}
});

// Chess: real legal moves from chess.js, with a simple computer opponent.
const pieces={
 w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},
 b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}
};
function newChess(level){
 aiLevel=level;
 if(!window.Chess){
  $('message').textContent='Chess library could not load. Check your internet connection and reload.';
  return;
 }
 chess=new Chess();selected=null;drawBoard();
 $('message').textContent='White to move. Choose a piece, then a destination.';
}
function drawBoard(){
 const board=$('board');board.innerHTML='';
 if(!chess)return;
 const rows=chess.board();
 rows.forEach((row,r)=>row.forEach((piece,c)=>{
  const sq=document.createElement('button');
  sq.className='square '+((r+c)%2?'dark':'light');
  const name='abcdefgh'[c]+(8-r);
  if(selected===name)sq.classList.add('selected');
  sq.textContent=piece?pieces[piece.color][piece.type]:'';
  sq.setAttribute('aria-label',name);
  sq.onclick=()=>chooseSquare(name);
  board.appendChild(sq);
 }));
}
function chooseSquare(name){
 if(!chess||chess.game_over())return;
 const piece=chess.get(name);
 if(selected){
  let move=chess.move({from:selected,to:name,promotion:'q'});
  if(move){
   selected=null;drawBoard();
   if(chess.in_checkmate()){$('message').textContent='Checkmate! You win!';return}
   if(chess.in_draw()){$('message').textContent='Draw game!';return}
   $('message').textContent='Computer is thinking…';
   setTimeout(aiMove,350);return;
  }
 }
 if(piece&&piece.color==='w'){selected=name}else{selected=null}
 drawBoard();
}
function aiMove(){
 if(!chess||chess.game_over())return;
 let moves=chess.moves({verbose:true});
 if(!moves.length)return;
 let chosen;
 if(aiLevel==='easy')chosen=moves[Math.floor(Math.random()*moves.length)];
 else{
  const captures=moves.filter(m=>m.captured);
  const checks=moves.filter(m=>m.san.includes('+')||m.san.includes('#'));
  if(aiLevel==='hard'&&checks.length&&Math.random()<.6)chosen=checks[Math.floor(Math.random()*checks.length)];
  else if(captures.length&&Math.random()<.7)chosen=captures[Math.floor(Math.random()*captures.length)];
  else chosen=moves[Math.floor(Math.random()*moves.length)];
 }
 chess.move(chosen);drawBoard();
 $('message').textContent=chess.in_checkmate()?'Computer wins! Try again.':chess.in_draw()?'Draw game!':'Your turn — white to move.';
}
</script>
</body>
</html>
